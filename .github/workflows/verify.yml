name: Verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:architecture
      - name: Check project map and change coverage
        run: npm run check:project-map -- --base "$MAP_BASE"
        env:
          MAP_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run test
      - run: npm run build

  documentation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-pr-documentation.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

