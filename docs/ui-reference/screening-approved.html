<style>
#teacher-flow{--tf-bg:light-dark(#f1f5f9,#111827);--tf-panel:light-dark(#fff,#1f2937);--tf-ink:light-dark(#172033,#eef2f7);--tf-muted:light-dark(#475569,#cbd5e1);--tf-line:light-dark(#cbd5e1,#526071);--tf-action:light-dark(#4338ca,#a5b4fc);--tf-on-action:light-dark(#fff,#172033);--tf-soft:light-dark(#eef2ff,#303a5c);color:var(--tf-ink);font:14px/1.5 system-ui,sans-serif;color-scheme:light dark}
#teacher-flow *{box-sizing:border-box}#teacher-flow [hidden]{display:none!important}#teacher-flow button,#teacher-flow select,#teacher-flow input{font:inherit;color:inherit}#teacher-flow button{cursor:inherit}#teacher-flow button:focus-visible,#teacher-flow select:focus-visible,#teacher-flow input:focus-visible{outline:3px solid var(--tf-action);outline-offset:3px}#teacher-flow h2{font-size:23px;line-height:1.25;margin:0 0 6px;font-weight:650}#teacher-flow h3{font-size:17px;line-height:1.4;margin:0 0 6px;font-weight:650}#teacher-flow p{margin:0 0 6px}#teacher-flow .tf-shell{background:var(--tf-bg);border:1px solid var(--tf-line);border-radius:8px;overflow:clip}#teacher-flow header{padding:7px 12px;background:var(--tf-panel);border-bottom:1px solid var(--tf-line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-right:104px}#teacher-flow .tf-brand{font-size:16px;font-weight:650}#teacher-flow .tf-demo{font-size:12px;color:var(--tf-muted)}#teacher-flow .tf-layout{display:grid;grid-template-columns:165px minmax(0,1fr)}#teacher-flow nav{background:#1e293b;color:#f8fafc;padding:8px 7px}#teacher-flow nav span{display:block;padding:4px 8px;margin:2px 0;border-radius:5px}#teacher-flow nav .tf-active{background:#fcd34d;color:#172033;font-weight:650}#teacher-flow main{min-width:0;padding:12px}#teacher-flow .tf-context{display:flex;align-items:end;gap:12px;margin:8px 0 10px;flex-wrap:wrap}#teacher-flow label{display:block}#teacher-flow select,#teacher-flow input[type=text]{display:block;background:var(--tf-panel);border:1px solid var(--tf-line);border-radius:5px;padding:6px 8px;max-width:100%;width:100%}#teacher-flow .tf-context label{min-width:180px}#teacher-flow .tf-note{color:var(--tf-muted);font-size:13px}#teacher-flow .tf-panel{background:var(--tf-panel);border:1px solid var(--tf-line);border-radius:7px;padding:10px;box-shadow:0 2px 5px #0000000c}#teacher-flow .tf-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}#teacher-flow .tf-button{background:var(--tf-panel);border:1px solid var(--tf-line);border-radius:5px;padding:5px 10px;min-height:32px;text-align:center}#teacher-flow .tf-primary{background:var(--tf-action);color:var(--tf-on-action);border-color:var(--tf-action)}#teacher-flow .tf-link{border:0;background:none;padding:5px 0;color:var(--tf-action);text-align:left;text-decoration:underline}#teacher-flow .tf-tabs{display:flex;gap:18px;border-bottom:1px solid var(--tf-line);margin-bottom:8px}#teacher-flow .tf-tabs button{border:0;border-bottom:3px solid transparent;background:none;padding:9px 0}#teacher-flow .tf-tabs button[aria-pressed=true]{border-color:var(--tf-action);font-weight:650}#teacher-flow .tf-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:5px 0;border-top:1px solid var(--tf-line);align-items:center}#teacher-flow .tf-row:first-of-type{border-top:0}#teacher-flow .tf-row strong{display:block;font-weight:650}#teacher-flow .tf-state{font-size:12px;color:var(--tf-muted)}#teacher-flow .tf-steps{display:flex;list-style:none;gap:14px;padding:0;margin:0 0 10px;flex-wrap:wrap;color:var(--tf-muted);font-size:13px}#teacher-flow .tf-steps li[aria-current=step]{color:var(--tf-action);font-weight:650}#teacher-flow .tf-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}#teacher-flow .tf-choice{border:1px solid var(--tf-line);border-radius:6px;padding:10px;background:var(--tf-panel);text-align:left}#teacher-flow .tf-choice b{display:block;margin-bottom:6px}#teacher-flow .tf-fields{display:grid;gap:10px}#teacher-flow .tf-actions{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px solid var(--tf-line);padding-top:8px;margin-top:10px}#teacher-flow .tf-check{display:flex;gap:9px;align-items:center;padding:8px 0}#teacher-flow .tf-check input{accent-color:var(--tf-action)}#teacher-flow .tf-summary{display:grid;grid-template-columns:120px 1fr;gap:0;margin:0}#teacher-flow .tf-summary dt,#teacher-flow .tf-summary dd{padding:5px 0;border-bottom:1px solid var(--tf-line);margin:0}#teacher-flow .tf-summary dt{color:var(--tf-muted)}#teacher-flow .tf-summary dd{overflow-wrap:anywhere}#teacher-flow .tf-receipt{border-left:4px solid var(--tf-action);padding:8px 14px;margin:16px 0;background:var(--tf-soft)}#teacher-flow .tf-bottom{font-size:12px;color:var(--tf-muted);margin:12px 0 0}#teacher-flow .tf-choose-label{display:block;font-weight:650;margin-top:14px}
@media(max-width:760px){#teacher-flow .tf-layout{grid-template-columns:1fr}#teacher-flow nav{display:flex;flex-wrap:wrap;gap:2px;padding:6px}#teacher-flow nav span{padding:5px 7px;font-size:12px}#teacher-flow main{padding:10px}#teacher-flow header{padding:10px 100px 10px 12px}#teacher-flow .tf-brand{font-size:14px}#teacher-flow .tf-choices{grid-template-columns:1fr}#teacher-flow .tf-panel{padding:8px}#teacher-flow .tf-steps{gap:8px}#teacher-flow .tf-summary{grid-template-columns:95px 1fr}}
@media(pointer:coarse){#teacher-flow .tf-button,#teacher-flow .tf-link,#teacher-flow .tf-tabs button,#teacher-flow select{min-height:44px}#teacher-flow input{font-size:16px}#teacher-flow .tf-check{min-height:44px}}
</style>
<style>
#teacher-flow .tf-recipient-toolbar{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:10px;margin:8px 0}#teacher-flow input[type=search]{display:block;width:100%;max-width:100%;padding:7px 9px;border:1px solid var(--tf-line);border-radius:5px;background:var(--tf-panel);color:var(--tf-ink);font:inherit}#teacher-flow .tf-picks{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 7px}#teacher-flow .tf-pick{display:inline-flex;align-items:center;gap:7px;padding:1px 6px;background:var(--tf-soft);border:1px solid var(--tf-line);border-radius:5px}#teacher-flow .tf-pick button{background:none;border:0;color:var(--tf-action);padding:3px 5px}#teacher-flow .tf-results{border-block:1px solid var(--tf-line);margin:6px 0}#teacher-flow .tf-result{display:flex;align-items:center;gap:8px;padding:3px 2px;border-bottom:1px solid var(--tf-line)}#teacher-flow .tf-result:last-child{border-bottom:0}#teacher-flow .tf-result input{flex:none;accent-color:var(--tf-action);width:17px;height:17px}#teacher-flow .tf-result span{min-width:0;overflow-wrap:anywhere;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}#teacher-flow .tf-result small{display:inline;color:var(--tf-muted);font-size:12px}#teacher-flow .tf-selected-heading{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}#teacher-flow .tf-recipient-count{font-weight:650}#teacher-flow .tf-details-list{columns:2;list-style:none;padding:0;margin:10px 0}#teacher-flow .tf-details-list li{break-inside:avoid;padding:3px 0;font-size:13px}@media(max-width:450px){#teacher-flow .tf-recipient-toolbar{grid-template-columns:1fr}#teacher-flow .tf-details-list{columns:1}}@media(pointer:coarse){#teacher-flow .tf-pick button{min-width:44px;min-height:44px}#teacher-flow .tf-result{min-height:44px}#teacher-flow input[type=search]{font-size:16px;min-height:44px}}
</style>
<style>
#teacher-flow main{padding:16px}#teacher-flow .tf-panel{padding:14px}#teacher-flow h3,#teacher-flow p{margin-bottom:8px}#teacher-flow .tf-steps{margin-bottom:14px}#teacher-flow .tf-recipient-toolbar{margin:12px 0;gap:12px}#teacher-flow .tf-pick{padding:3px 8px}#teacher-flow .tf-result{padding:5px}#teacher-flow .tf-result:has(input:checked){background:var(--tf-soft);border-radius:4px}#teacher-flow .tf-recipient-count{color:var(--tf-action)}#teacher-flow .tf-type-heading{margin:12px 0 4px;color:var(--tf-muted);font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}#teacher-flow .tf-steps li[aria-current=step]{background:var(--tf-soft);border-radius:4px;padding:2px 6px}#teacher-flow .tf-primary{box-shadow:0 2px 4px #00000012}#teacher-flow .tf-primary:hover{filter:brightness(1.08)}
</style>
<div id="teacher-flow">
  <div class="tf-shell">
    <header><span class="tf-brand">Matematik · Lärarvy</span><span class="tf-demo">Designförslag · demodata</span></header>
    <div class="tf-layout">
      <nav aria-label="Föreslagen huvudnavigation"><span>Framsteg</span><span>Uppdrag &amp; tickets</span><span>Statistik &amp; stöd</span><span class="tf-active">Screening: dela ut</span><span>Screening: resultat</span><span>Administration</span></nav>
      <main>
        <h2 id="tf-heading">Screeningar för klass 6A</h2>
        <div class="tf-context"><label>Visa för<select id="tf-group"><option value="class">Klass 6A · 24 elever</option><option value="group">Grupp Eken · 6 elever</option></select></label><span class="tf-note" id="tf-context-note">Utdelningar och status för den valda klassen.</span></div>
        <div id="tf-screen" class="tf-panel"></div>
        <p class="tf-bottom">Föreslaget arbetsflöde. Alla handlingar stannar i exemplet.</p>
      </main>
    </div>
  </div>
</div>
<script>
(() => {
const root = document.getElementById('teacher-flow');
const screen = root.querySelector('#tf-screen');
const picker = root.querySelector('#tf-group');
const data = {class:{name:'klass 6A',count:24,rows:[['Taluppfattning – oktober','Aktiv · 18 av 24 inlämnade'],['Addition och subtraktion','Avslutad · 24 av 24 inlämnade']]},group:{name:'grupp Eken',count:6,rows:[['Taluppfattning – oktober','Aktiv · 4 av 6 inlämnade']]}};
const pupils = ['6A','6B','7C'].flatMap((className,classIndex)=>Array.from({length:[24,22,20][classIndex]},(_,index)=>({id:`p-${className}-${index}`,name:className==='7C'&&index===10?'Sam (demo)':index===0?`Alex ${className} (demo)`:`Demoelev ${String(index+1).padStart(2,'0')} · ${className}`,className})));
const pupilIds=className=>pupils.filter(p=>p.className===className).map(p=>p.id);
const entities = [
 ...['6A','6B','7C'].map(className=>({id:`c-${className}`,type:'class',name:`Klass ${className}`,members:pupilIds(className),detail:`${pupilIds(className).length} elever`})),
 {id:'g-eken',type:'group',name:'Grupp Eken',members:[...pupilIds('6A').slice(0,3),...pupilIds('6B').slice(0,3)],detail:'6 elever · 6A och 6B'},
 {id:'g-bjorken',type:'group',name:'Grupp Björken',members:[...pupilIds('6B').slice(4,8),...pupilIds('7C').slice(0,4)],detail:'8 elever · 6B och 7C'},
 ...pupils.map(p=>({id:p.id,type:'pupil',name:p.name,members:[p.id],detail:`Elev · klass ${p.className}`}))
];
let selected=new Set(['c-6A','c-6B','g-eken','p-7C-10']);
let query='',typeFilter='all';
let stage='audience',tab='issued',mode='reuse',name='Taluppfattning – oktober',snapshot='class',receipt=false,recipientNames='';
const escape = s => s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(action,text,primary=false)=>`<button type="button" class="tf-button cursor-interaction ${primary?'tf-primary':''}" data-action="${action}">${text}</button>`;
const steps=active=>`<ol class="tf-steps" aria-label="Utdelningsflöde"><li ${active===1?'aria-current="step"':''}>1. Innehåll</li><li ${active===2?'aria-current="step"':''}>2. Mottagare &amp; inställningar</li><li ${active===3?'aria-current="step"':''}>3. Kontrollera &amp; dela ut</li></ol>`;
const chosen=()=>entities.filter(e=>selected.has(e.id));
const resolved=()=>new Set(chosen().flatMap(e=>e.members));
const selectedSummary=()=>chosen().map(e=>e.name).join(', ');
const normal=s=>s.toLocaleLowerCase('sv').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function renderRecipients(){
 const count=resolved().size;
 root.querySelector('#tf-selected').innerHTML=chosen().map(e=>`<span class="tf-pick">${escape(e.name)}<button type="button" class="cursor-interaction" data-remove="${e.id}" aria-label="Ta bort ${escape(e.name)}">×</button></span>`).join('')||'<span class="tf-note">Inga mottagare valda.</span>';
 root.querySelector('#tf-count').textContent=`${count} unika elever får screeningen`;
 root.querySelector('#tf-selected-details').innerHTML=pupils.filter(p=>resolved().has(p.id)).map(p=>`<li>${escape(p.name)} · ${p.className}</li>`).join('');
 let matching=entities.filter(e=>(typeFilter==='all'||e.type===typeFilter)&&normal(`${e.name} ${e.detail}`).includes(normal(query)));
 if(!query&&typeFilter==='all')matching=matching.filter(e=>e.type!=='pupil'||['p-6A-0','p-6B-0','p-7C-10'].includes(e.id));
 root.querySelector('#tf-matches').innerHTML=matching.map((e,index)=>`${index===0||matching[index-1].type!==e.type?`<h4 class="tf-type-heading">${({class:'Klasser',group:'Grupper',pupil:'Elever'})[e.type]}</h4>`:''}<label class="tf-result"><input type="checkbox" value="${e.id}" data-recipient ${selected.has(e.id)?'checked':''}><span>${escape(e.name)}<small>${escape(e.detail)}</small></span></label>`).join('')||'<p class="tf-note">Inga träffar. Prova ett annat namn eller en annan klass.</p>';
 root.querySelector('[data-action="review"]').disabled=count===0;
}
function render(){
 const group=data[snapshot];const context=data[picker.value];
 root.querySelector('#tf-heading').textContent=stage==='list'||stage==='detail'?`Screeningar för ${context.name}`:'Dela ut screening';
 root.querySelector('.tf-context').hidden=stage!=='list'&&stage!=='detail';
 root.querySelector('#tf-context-note').textContent=stage==='list'?'Utdelningar och status för det valda urvalet.':'Du kan dela ut till flera klasser, grupper och elever oavsett visningsurval.';
 picker.disabled=stage!=='list';
 if(stage==='list'){
 screen.innerHTML=`<div class="tf-bar"><h3>${tab==='issued'?'Utdelat till '+escape(context.name):'Materialbibliotek'}</h3>${button('start','Dela ut screening',true)}</div><div class="tf-tabs" aria-label="Screeninglistor"><button type="button" class="cursor-interaction" aria-pressed="${tab==='issued'}" data-action="issued">Utdelat</button><button type="button" class="cursor-interaction" aria-pressed="${tab==='library'}" data-action="library">Materialbibliotek</button></div>${tab==='issued'?context.rows.map(row=>`<div class="tf-row"><div><strong>${escape(row[0])}</strong><span class="tf-state">${escape(row[1])}</span></div>${button('detail','Visa mottagare')}</div>`).join(''):`<p class="tf-note">Sparat innehåll att återanvända i en ny utdelning.</p><div class="tf-row"><div><strong>Taluppfattning – oktober</strong><span class="tf-state">NCM Diamant · 6 frågor · sparat material</span></div>${button('reuse','Återanvänd')}</div>`}`;
 if(receipt)screen.insertAdjacentHTML('afterbegin',`<div class="tf-receipt" role="status">Demo: “${escape(name)}” har delats ut till ${escape(recipientNames)}. Ingen riktig utdelning har gjorts.</div>`);
 } else if(stage==='detail') {
 screen.innerHTML=`<h3>Mottagare · Taluppfattning – oktober</h3><p>${context.count} elever i ${escape(context.name)}.</p><p class="tf-note">En riktig vy visar namn och genomförandestatus för samtliga behöriga mottagare.</p>${button('list','Tillbaka till utdelat')}`;
 } else if(stage==='start') {
 screen.innerHTML=`<h3>Vad vill du dela ut?</h3><p class="tf-note">Mottagare väljs med sök och flerval i nästa del av flödet.</p><div class="tf-choices"><button type="button" class="tf-choice cursor-interaction" data-action="reuse"><b>Återanvänd</b>Välj sparat material. Eleverna får en ny utdelning.</button><button type="button" class="tf-choice cursor-interaction" data-action="new"><b>Skapa ny</b>Välj uppgifter och lägg till egna frågor.</button></div><div class="tf-actions">${button('list','Tillbaka till utdelat')}</div>`;
 } else if(stage==='content') {
 screen.innerHTML=steps(1)+`<h3>${mode==='reuse'?'Återanvänd sparat material':'Skapa en ny screening'}</h3><div class="tf-fields">${mode==='reuse'?`<label>Material<select id="tf-material"><option>Taluppfattning – oktober · 6 frågor</option></select></label><p class="tf-note">Frågor och arbetsytor kopieras. Tidigare elevsvar följer inte med.</p>`:`<label>Screeningens namn<input type="text" id="tf-title" value="${escape(name)}" maxlength="100"></label><label>Uppgiftsområde<select><option>NCM Diamant · Taluppfattning · 6 frågor</option></select></label>`}<details><summary>Visa uppgifternas innehåll</summary><p class="tf-note">Demo: sex taluppfattningsfrågor med facit och räknehäfte. Detaljerad redigerare ingår inte i exemplet.</p></details></div><div class="tf-actions">${button('start','Tillbaka')}${button('audience','Välj mottagare',true)}</div>`;
 } else if(stage==='audience') {
 screen.innerHTML=steps(2)+`<h3>Välj mottagare</h3><p class="tf-note">Kombinera klasser, grupper och enskilda elever. Samma elev får screeningen en gång.</p><div class="tf-selected-heading"><strong>Valda mottagare</strong><button type="button" class="tf-link cursor-interaction" data-action="clear">Rensa urval</button></div><div id="tf-selected" class="tf-picks"></div><p id="tf-count" class="tf-recipient-count" role="status" aria-live="polite"></p><details><summary>Visa elever som ingår</summary><ul id="tf-selected-details" class="tf-details-list"></ul></details><div class="tf-recipient-toolbar"><label>Sök klass, grupp eller elev<input type="search" id="tf-search" placeholder="Namn, klass eller grupp" value="${escape(query)}"></label><label>Visa<select id="tf-type"><option value="all">Alla typer</option><option value="class">Klasser</option><option value="group">Grupper</option><option value="pupil">Elever</option></select></label></div><div id="tf-matches" class="tf-results"></div><details><summary>Arbetsytor</summary><p>Räknehäfte på. Rityta av. Inställningarna följer med det valda materialet i detta exempel.</p></details><div class="tf-actions">${button('content','Tillbaka')}${button('review','Kontrollera utdelningen',true)}</div>`;
 root.querySelector('#tf-type').value=typeFilter;renderRecipients();
 } else if(stage==='review') {
 const count=resolved().size;
 screen.innerHTML=steps(3)+`<h3>Kontrollera innan du delar ut</h3><dl class="tf-summary"><dt>Innehåll</dt><dd>${escape(name)} · 6 frågor<br><button type="button" class="tf-link cursor-interaction" data-action="content">Ändra innehåll</button></dd><dt>Mottagare</dt><dd>${escape(selectedSummary())}<br><strong>${count} unika elever</strong> · överlapp räknas en gång<br><button type="button" class="tf-link cursor-interaction" data-action="audience">Ändra mottagare</button></dd><dt>Arbetsytor</dt><dd>Räknehäfte på · rityta av</dd></dl><p class="tf-note" style="margin-top:14px">Detta blir en ny utdelning. Tidigare screeningar och svar ligger kvar.</p><div class="tf-actions">${button('audience','Tillbaka')}${button('send',`Dela ut till ${count} elever`,true)}</div>`;
 }
}
root.addEventListener('click',e=>{const remove=e.target.closest('[data-remove]');if(remove){selected.delete(remove.dataset.remove);renderRecipients();return;}const trigger=e.target.closest('[data-action]');if(!trigger)return;const action=trigger.dataset.action;
 if(action==='clear'){selected.clear();renderRecipients();return;}
 if(action==='issued'||action==='library'){tab=action;stage='list';receipt=false;}
 else if(action==='start'){if(stage==='list'){selected=new Set();query='';typeFilter='all';}snapshot=picker.value;stage='start';receipt=false;}
 else if(action==='reuse'||action==='new'){if(stage==='list'){snapshot=picker.value;selected=new Set();query='';typeFilter='all';}mode=action;name=action==='reuse'?'Taluppfattning – oktober':'Ny taluppfattningsscreening';stage='content';receipt=false;}
 else if(action==='review'&&resolved().size===0)return;
 else if(action==='send'){if(!resolved().size)return;recipientNames=`${resolved().size} unika elever: ${selectedSummary()}`;receipt=true;stage='list';tab='issued';}
 else{if(stage==='content'){const field=root.querySelector('#tf-title');if(field)name=field.value.trim()||'Ny screening';}stage=action;}
 render();});
picker.addEventListener('change',()=>{receipt=false;snapshot=picker.value;render();});
root.addEventListener('input',e=>{if(e.target.id==='tf-search'){query=e.target.value;renderRecipients();}});
root.addEventListener('change',e=>{if(e.target.id==='tf-type'){typeFilter=e.target.value;renderRecipients();}if(e.target.hasAttribute('data-recipient')){if(e.target.checked)selected.add(e.target.value);else selected.delete(e.target.value);renderRecipients();}});
render();
})();
</script>
